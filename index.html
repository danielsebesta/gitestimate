<!doctype html>
<html lang="en">
  <head>
    <script>
      // apply saved color mode before first paint (same attrs github.com uses)
      (function () {
        var d = document.documentElement;
        d.dataset.colorMode = localStorage.getItem("color-mode") || "auto";
        d.dataset.lightTheme = "light";
        d.dataset.darkTheme = "dark";
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>GitEstimate — how long did this repo take?</title>
    <meta
      name="description"
      content="Estimate how much time was spent building a GitHub repository from its commit history."
    />
    <meta property="og:title" content="GitEstimate — how long did this repo take?" />
    <meta
      property="og:description"
      content="Estimate how much time was spent building a GitHub repository from its commit history. Runs entirely in your browser."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GitEstimate — how long did this repo take?" />
    <meta
      name="twitter:description"
      content="Estimate how much time was spent building a GitHub repository from its commit history."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
