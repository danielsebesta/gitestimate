<!doctype html>
<html lang="en">
  <head>
    <script>
      // apply saved color mode before first paint (same attrs github.com uses)
      (function () {
        var d = document.documentElement;
        d.dataset.colorMode = localStorage.getItem("color-mode") || "auto";
        d.dataset.lightTheme = "light";
        d.dataset.darkTheme = "dark";
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme via HTML media — CSS @media inside SVG favicons is unreliable -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="./icon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./icon-light.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-dark-32x32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-light-32x32.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="./favicon-dark.ico"
      sizes="any"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="./favicon-light.ico"
      sizes="any"
      media="(prefers-color-scheme: light)"
    />
    <!-- Fallback when media is ignored: light stroke (readable on dark tabs) -->
    <link rel="icon" type="image/svg+xml" href="./icon-dark.svg" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>GitEstimate — how long did this repo take?</title>
    <meta
      name="description"
      content="Estimate how much time was spent building a GitHub repository from its commit history."
    />
    <meta property="og:title" content="GitEstimate — how long did this repo take?" />
    <meta
      property="og:description"
      content="Estimate how much time was spent building a GitHub repository from its commit history. Runs entirely in your browser."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GitEstimate — how long did this repo take?" />
    <meta
      name="twitter:description"
      content="Estimate how much time was spent building a GitHub repository from its commit history."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
